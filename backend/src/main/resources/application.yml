# 服务端口
server:
  port: 8080

# MySQL 数据源配置（请根据本地 MySQL 修改）
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/calorie_tracker?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
    username: root
    # 密码通过环境变量 MYSQL_PASSWORD 传入，启动命令：
    # MYSQL_PASSWORD=yourpass mvn spring-boot:run
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # SQL 日志，开发时方便调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 下划线转驼峰
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键自增
      id-type: auto
      # 逻辑删除（暂不使用）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
